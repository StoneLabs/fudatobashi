name: fudatobashi_skin_editor
description: "Desktop editor for Fudatobashi card skins."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path: ^1.9.1
  watcher: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/standard.frag

  assets:
    - assets/glyphs/
    - assets/data/torifuda.json

  fonts:
    - family: TorifudaNumber
      fonts:
        - asset: assets/fonts/TeXGyreSchola-Regular.otf
