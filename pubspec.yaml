name: fudatobashi
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The app version. The build number is not set here: the build scripts and CI
# pass the git commit count (scripts/version.sh).
version: 2.1.0

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_displaymode: ^0.7.0
  fsrs: ^2.0.1
  package_info_plus: ^10.2.2
  audioplayers: ^6.8.1
  xml: ^7.1.0
  url_launcher: ^6.3.3
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  sqlite3: ^3.7.1
  markdown: ^7.3.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data/poems.json
    - assets/data/islands.json
    - assets/l10n/
    - assets/l10n/en_card_explanations/
    - assets/l10n/ja_card_explanations/
    - assets/glyphs/
    - assets/graphics/tally.svg
    - assets/graphics/icons/
    - assets/graphics/map/
    - assets/graphics/scenes/
    - assets/graphics/tobi/
    - assets/graphics/sidetrips/
    - assets/graphics/cards/
    - assets/graphics/cards/yomifuda/
    - assets/graphics/cards/torifuda/
    - assets/graphics/ankiren/
    - assets/graphics/sidetrips/scene/
    - assets/graphics/sidetrips/islands/
    - assets/graphics/sidetrips/ankiren/
    - assets/graphics/sidetrips/ui/
    - assets/sounds/
    - assets/voice/kimariji/
    - assets/fonts/OFL-delagothicone.txt
    - assets/fonts/OFL-reggaeone.txt
    - assets/fonts/OFL-YujiSyuku.txt
    - assets/fonts/OFL-zenkakugothicnew.txt
    - assets/fonts/GUST-FONT-LICENSE.txt
    - assets/legal/privacy-policy.md
    - assets/legal/privacy-policy.ja.md

  fonts:
    # Card kana come from assets/glyphs (pre-rendered, see tool/render_glyphs_test.dart);
    # the source font is not bundled.
    - family: TorifudaNumber
      fonts:
        - asset: assets/fonts/TeXGyreSchola-Regular.otf
    # UI (manga world)
    - family: Dela
      fonts:
        - asset: assets/fonts/DelaGothicOne-Regular.ttf
    - family: Reggae
      fonts:
        - asset: assets/fonts/ReggaeOne-Regular.ttf
    - family: YujiSyuku
      fonts:
        - asset: assets/fonts/YujiSyuku-Regular.ttf
    - family: ZenKaku
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZenKakuGothicNew-Black.ttf
          weight: 900
