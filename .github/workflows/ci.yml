# CI: runs the checks, then builds every platform. The build jobs run in three cases:
#   - a version tag push ("git push github vX.Y.Z"): builds, then attaches the
#     files to a new GitHub Release;
#   - every push to main: builds and keeps the files as workflow artifacts only
#     (30 days). No release, no tag;
#   - manually via the "Run workflow" button (workflow_dispatch): artifacts only.
# Branch pushes and pull requests only run the checks. The Android .apk and .aab
# are uploaded unzipped, each as its own artifact named after the file; every
# other platform is packed into one file first and uploaded the same way.
# The build number and version name come from scripts/version.sh, the same helper
# the local build scripts use: the build number is the commit count, and the name
# is the pubspec version on a tagged commit, otherwise <version>-dev.<commit count>.<short hash>.
# iOS, macOS and Windows only get the build number as their platform version
# (they need a plain one); the full name is passed as --dart-define=BUILD_NAME so
# the Settings page can still show it.
# The iOS job also builds an App Store-signed IPA when the secrets IOS_DIST_P12,
# IOS_DIST_P12_PASSWORD, IOS_PROFILE and APPLE_TEAM_ID exist (otherwise it only
# makes the unsigned one).
name: CI
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  version:
    name: Resolve version
    needs: test
    if: ${{ needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_name: ${{ steps.resolve.outputs.build_name }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        run: |
          source scripts/version.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$BUILD_NAME"
          fi
          echo "Resolved version: $version (app version name $BUILD_NAME, build number $BUILD_NUMBER)"
          {
            echo "version=$version"
            echo "build_name=$BUILD_NAME"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android (APK + AAB)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Signing release build with the uploaded release key."
            echo "SIGNED_SUFFIX=GH_SIGNED" >> "$GITHUB_ENV"
          else
            echo "::warning::Android signing secrets are not set; the release build will use the debug key."
            echo "SIGNED_SUFFIX=debug-signed" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ needs.version.outputs.build_number }}
      - run: flutter build appbundle --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/fudatobashi-$VERSION-$SIGNED_SUFFIX.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/fudatobashi-$VERSION-$SIGNED_SUFFIX.aab"

      # archive: false uploads each file as is (no zip); the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          archive: false
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.aab
          archive: false
          retention-days: 30

  ios:
    name: iOS (unsigned and App Store IPA)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER" --dart-define=BUILD_NAME="$BUILD_NAME"

      - name: Package IPA
        run: |
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "dist/fudatobashi-$VERSION-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*-unsigned.ipa
          archive: false
          retention-days: 30

      - name: Install signing certificate and profile
        if: ${{ env.IOS_DIST_P12 != '' && env.IOS_DIST_P12_PASSWORD != '' && env.IOS_PROFILE != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$IOS_DIST_P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$profile_uuid.mobileprovision"
          done
          echo "Installed profile \"$profile_name\" ($profile_uuid)"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.sobadev.fudatobashi</key><string>$profile_name</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

      # Manual signing is set on the Runner target only (CI-side edit of the
      # project file, not committed): the CocoaPods targets reject profiles.
      - name: Build App Store IPA
        if: ${{ env.IOS_DIST_P12 != '' && env.IOS_DIST_P12_PASSWORD != '' && env.IOS_PROFILE != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          python3 - <<'PY'
          import os, re
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          text = open(path).read()
          block = re.search(r'97C147071CF9000F007C117D /\* Release \*/ = \{.*?buildSettings = \{\n', text, re.S)
          settings = (
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              '\t\t\t\tDEVELOPMENT_TEAM = %s;\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "%s";\n'
              % (os.environ['APPLE_TEAM_ID'], os.environ['PROFILE_NAME'])
          )
          open(path, 'w').write(text[:block.end()] + settings + text[block.end():])
          PY
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=BUILD_NAME="$BUILD_NAME" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p dist
          cp build/ios/ipa/*.ipa "dist/fudatobashi-$VERSION-appstore.ipa"

      - name: Upload App Store IPA
        if: ${{ env.IOS_DIST_P12 != '' && env.IOS_DIST_P12_PASSWORD != '' && env.IOS_PROFILE != '' && env.APPLE_TEAM_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-appstore.ipa
          archive: false
          retention-days: 30

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"

  macos:
    name: macOS (.app)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release --build-number=${{ needs.version.outputs.build_number }} --dart-define=BUILD_NAME=${{ needs.version.outputs.build_name }}

      - name: Zip app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/fudatobashi.app \
            "dist/fudatobashi-$VERSION-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          retention-days: 30

  linux:
    name: Linux (.tar.gz)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/fudatobashi-$VERSION-linux.tar.gz" -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false
          retention-days: 30

  windows:
    name: Windows (Release folder)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ needs.version.outputs.build_number }} "--dart-define=BUILD_NAME=${{ needs.version.outputs.build_name }}"

      - name: Zip Release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\fudatobashi-$env:VERSION-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          retention-days: 30

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: [version, android, ios, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          skip-decompress: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f)
          gh release create "${{ github.ref_name }}" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --title "Fudatobashi ${{ needs.version.outputs.version }}" \
            --generate-notes
