# CI: runs the checks, then builds every platform. The build jobs run in three cases:
#   - a version tag push ("git push github vX.Y.Z"): builds, then attaches the
#     files to a new GitHub Release;
#   - every push to main: builds and keeps the files as workflow artifacts only
#     (30 days). No release, no tag;
#   - manually via the "Run workflow" button (workflow_dispatch): artifacts only.
# Branch pushes and pull requests only run the checks. The Android .apk and .aab
# are uploaded unzipped, each as its own artifact named after the file; every
# other platform is packed into one file first and uploaded the same way.
# The build number and version name come from scripts/version.sh, the same helper
# the local build scripts use: the build number is the commit count, and the name
# is the pubspec version on a tagged commit, otherwise <version>-dev.<commit count>.<short hash>.
# iOS, macOS and Windows only get the build number (they need a plain version).
#
# Android release signing is optional: set these repo secrets to sign with
# the real release key instead of falling back to the debug key:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# That key is a GitHub-only signing key (the Play Store release will be signed
# separately), so the built .apk/.aab are named …-GH_SIGNED, or …-debug-signed
# when the secrets are missing. The iOS build has no Apple certificate at all,
# so it's always named …-unsigned.
name: CI
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  version:
    name: Resolve version
    needs: test
    if: ${{ needs.test.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_name: ${{ steps.resolve.outputs.build_name }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        run: |
          source scripts/version.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$BUILD_NAME"
          fi
          echo "Resolved version: $version (app version name $BUILD_NAME, build number $BUILD_NUMBER)"
          {
            echo "version=$version"
            echo "build_name=$BUILD_NAME"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android (APK + AAB)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Signing release build with the uploaded release key."
            echo "SIGNED_SUFFIX=GH_SIGNED" >> "$GITHUB_ENV"
          else
            echo "::warning::Android signing secrets are not set; the release build will use the debug key."
            echo "SIGNED_SUFFIX=debug-signed" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ needs.version.outputs.build_number }}
      - run: flutter build appbundle --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/fudatobashi-$VERSION-$SIGNED_SUFFIX.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/fudatobashi-$VERSION-$SIGNED_SUFFIX.aab"

      # archive: false uploads each file as is (no zip); the artifact is named after the file.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          archive: false
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.aab
          archive: false
          retention-days: 30

  ios:
    name: iOS (unsigned IPA)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ needs.version.outputs.build_number }}

      - name: Package IPA
        run: |
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "dist/fudatobashi-$VERSION-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.ipa
          archive: false
          retention-days: 30

  macos:
    name: macOS (.app)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release --build-number=${{ needs.version.outputs.build_number }}

      - name: Zip app bundle
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/fudatobashi.app \
            "dist/fudatobashi-$VERSION-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          retention-days: 30

  linux:
    name: Linux (.tar.gz)
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.build_name }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/fudatobashi-$VERSION-linux.tar.gz" -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false
          retention-days: 30

  windows:
    name: Windows (Release folder)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ needs.version.outputs.build_number }}

      - name: Zip Release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\fudatobashi-$env:VERSION-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          retention-days: 30

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: [version, android, ios, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f)
          gh release create "${{ github.ref_name }}" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --title "Fudatobashi ${{ needs.version.outputs.version }}" \
            --generate-notes
